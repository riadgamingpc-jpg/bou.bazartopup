<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RX TOP UP BD</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b12;
    color:white;
}

header{
    background:linear-gradient(90deg,#ff9800,#ff5722);
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

/* LOGIN */
.loginBox{
    max-width:350px;
    margin:80px auto;
    background:#141420;
    padding:15px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:8px;
    border:none;
}

/* BUTTON */
button{
    padding:10px;
    width:100%;
    margin-top:8px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.loginBtn{
    background:linear-gradient(90deg,#ff9800,#ff5722);
    color:white;
}

/* PROFILE */
.profile{
    background:#141420;
    padding:10px;
    margin:10px;
    border-radius:10px;
}

/* MAIN */
.container{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    padding:10px;
}

.box{
    background:#141420;
    padding:12px;
    border-radius:10px;
}

h2{ color:#ffcc00; }

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.grid button{
    background:#ff9800;
    color:black;
}

.grid button:hover{
    background:#ffa726;
}

/* SELECTED */
.selected{
    background:#00c853 !important;
    color:white !important;
    transform:scale(1.05);
}

.order{
    background:linear-gradient(90deg,#ff9800,#ff5722);
    color:white;
}

.hidden{ display:none; }

footer{
    text-align:center;
    padding:10px;
    background:#000;
    margin-top:10px;
}
</style>
</head>

<body>

<header>🔥 RX TOP UP BD 🔥</header>

<!-- LOGIN PAGE -->
<div id="loginPage" class="loginBox">
    <h2>Login / Register</h2>
    <input id="name" placeholder="Your Name">
    <input id="phone" placeholder="Phone Number">
    <button class="loginBtn" onclick="login()">LOGIN</button>
</div>

<!-- APP PAGE -->
<div id="appPage" class="hidden">

<div class="profile">
    👤 Welcome, <span id="userName"></span>
    <button onclick="logout()" style="float:right;width:auto;background:red;color:white;">Logout</button>
</div>

<div class="container">

<!-- LEFT -->
<div class="box">

<h2>🧾 Order</h2>

<input id="uid" placeholder="Game UID">
<input id="number" placeholder="Mobile Number">
<input id="pack" placeholder="Selected Package" readonly>

<button class="order" onclick="order()">ORDER NOW</button>

</div>

<!-- MIDDLE -->
<div class="box">

<h2>💎 Diamond</h2>
<div class="grid">
<button onclick="selectPack('25 Diamond - 22 TK', this)">25</button>
<button onclick="selectPack('50 Diamond - 39 TK', this)">50</button>
<button onclick="selectPack('115 Diamond - 75 TK', this)">115</button>
<button onclick="selectPack('240 Diamond - 150 TK', this)">240</button>
<button onclick="selectPack('355 Diamond - 220 TK', this)">355</button>
<button onclick="selectPack('480 Diamond - 300 TK', this)">480</button>
</div>

<h2>🎮 Evo Gun</h2>
<div class="grid">
<button onclick="selectPack('AK47 Blue Flame - 1200 TK', this)">AK47</button>
<button onclick="selectPack('MP40 Cobra - 1500 TK', this)">MP40</button>
<button onclick="selectPack('M4A1 Infernal - 1400 TK', this)">M4A1</button>
<button onclick="selectPack('SCAR Megalodon - 1300 TK', this)">SCAR</button>
</div>

<h2>🎟 Level Pass</h2>
<div class="grid">
<button onclick="selectPack('Basic Pass - 100 TK', this)">Basic</button>
<button onclick="selectPack('Elite Pass - 200 TK', this)">Elite</button>
<button onclick="selectPack('Premium Pass - 300 TK', this)">Premium</button>
</div>

</div>

<!-- RIGHT -->
<div class="box">

<h2>📦 Status</h2>
<p id="status">No Order Yet</p>

</div>

</div>

<footer>© RX TOP UP BD 2026</footer>

<script>

// LOGIN
function login(){
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;

    if(!name || !phone){
        alert("সব তথ্য দিন!");
        return;
    }

    localStorage.setItem("user", JSON.stringify({name, phone}));
    showApp();
}

// SHOW APP
function showApp(){
    let user = JSON.parse(localStorage.getItem("user"));

    if(user){
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("appPage").classList.remove("hidden");
        document.getElementById("userName").innerText = user.name;
    }
}

// LOGOUT
function logout(){
    localStorage.removeItem("user");
    location.reload();
}

// SELECT PACK (FIXED SECTION WISE)
function selectPack(pack, btn){
    document.getElementById("pack").value = pack;

    let parent = btn.parentElement;
    let buttons = parent.querySelectorAll("button");

    buttons.forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
}

// ORDER
function order(){
    let user = JSON.parse(localStorage.getItem("user"));

    let uid = document.getElementById("uid").value;
    let number = document.getElementById("number").value;
    let pack = document.getElementById("pack").value;

    if(!uid || !number || !pack){
        alert("সব তথ্য দিন!");
        return;
    }

    document.getElementById("status").innerText =
        "Order Placed by " + user.name + " ✔";

    console.log({user, uid, number, pack});
}

// AUTO LOGIN CHECK
showApp();

</script>

</body>
</html>
