<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বউ বাজার টপ আপ</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
margin:0;
}

.header{
background:black;
padding:15px;
font-size:22px;
color:#00ffd5;
}

.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
}

.box{
background:#222;
padding:15px;
border-radius:10px;
border:2px solid #333;
cursor:pointer;
}

.box.selected{
border:2px solid #00ffd5;
}

.price{
color:#00ffd5;
font-weight:bold;
}

input{
padding:12px;
width:80%;
margin:10px;
border-radius:6px;
border:none;
font-size:16px;
}

button{
background:#00ffd5;
color:black;
border:none;
padding:15px;
font-size:18px;
border-radius:8px;
margin:15px;
}

</style>
</head>

<body>

<div class="header">
🔥 বউ বাজার টপ আপ 🔥
</div>

<h3>Select Package</h3>

<div class="container">

<div class="box" onclick="select(this,'UCL Light - 1 TK')">
UCL Light 💎<br><span class="price">1 TK</span>
</div>

<div class="box" onclick="select(this,'UCL - 10 TK')">
UCL 💎<br><span class="price">10 TK</span>
</div>

<div class="box" onclick="select(this,'Matli - 660 TK')">
Matli 💎<br><span class="price">660 TK</span>
</div>

<div class="box" onclick="select(this,'Evo Gun 7 Day - 69 TK')">
Evo Gun 🔥<br><span class="price">69 TK</span>
</div>

<div class="box" onclick="select(this,'Evo Gun 30 Day - 330 TK')">
Evo Gun 30 Day 🔥<br><span class="price">330 TK</span>
</div>

<div class="box" onclick="select(this,'Level Up Pass - 150 TK')">
Level Up Pass 🎟<br><span class="price">150 TK</span>
</div>

</div>

<h3>Player ID</h3>

<input type="text" id="player" placeholder="Enter Player ID">

<h3>Payment Number</h3>

<p>bKash / Nagad</p>
<h2>01851634841</h2>

<button onclick="order()">Submit Order</button>

<script>

let selected="";

function select(el,val){

document.querySelectorAll(".box").forEach(b=>b.classList.remove("selected"));

el.classList.add("selected");

selected=val;

}

function order(){

let player=document.getElementById("player").value;

if(player=="" || selected==""){

alert("Player ID এবং Package Select করুন");

return;

}

let msg="বউ বাজার টপ আপ Order%0APlayer ID: "+player+"%0APackage: "+selected;

window.open("https://wa.me/8801851634841?text="+msg);

}

</script>

</body>
</html>
