<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST TOPUP</title>
<style>
body{font-family:Arial,sans-serif;background:#0b0f1a;color:white;text-align:center;margin:0;}
.header{display:flex;align-items:center;justify-content:center;padding:10px;}
.logo{width:50px;margin-right:10px;}
h1{color:#00ffd5;}
.section{background:#161b2e;margin:10px;padding:15px;border-radius:12px;}
.packages{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.package{background:#1e2a4a;padding:12px;border-radius:10px;cursor:pointer;transition:0.3s;}
.package:hover{transform:scale(1.05);}
.package.selected{border:2px solid #00ffd5;box-shadow:0 0 15px #00ffd5;}
input{padding:10px;border:none;border-radius:8px;margin:5px;width:80%;}
button{padding:12px;border:none;background:#00ffd5;border-radius:8px;font-weight:bold;cursor:pointer;}
.copy{background:red;color:white;}
.timer{color:#00ff85;font-size:20px;margin-top:10px;}
</style>
</head>
<body>

<div class="header">
<img src="https://i.ibb.co/6XzQ9nH/diamond-logo.png" class="logo">
<h1>ST TOPUP</h1>
</div>

<!-- Player -->
<div class="section">
<h3>🎮 Player UID</h3>
<input type="text" id="playerID" placeholder="Player ID লিখুন">
</div>

<!-- Diamond Packages -->
<div class="section">
<h3>💎 Diamond Packages</h3>
<div class="packages">
<div class="package" onclick="selectDiamond(this,'25 Diamond',24)">💎 25<br>24 TK</div>
<div class="package" onclick="selectDiamond(this,'50 Diamond',41)">💎 50<br>41 TK</div>
<div class="package" onclick="selectDiamond(this,'115 Diamond',77)">💎 115<br>77 TK</div>
<div class="package" onclick="selectDiamond(this,'240 Diamond',152)">💎 240<br>152 TK</div>
<div class="package" onclick="selectDiamond(this,'355 Diamond',242)">💎 355<br>242 TK</div>
<div class="package" onclick="selectDiamond(this,'610 Diamond',382)">💎 610<br>382 TK</div>
</div>
<p id="dshow">Selected: None</p>
</div>

<!-- Evo Gun -->
<div class="section">
<h3>🔥 Evo Gun</h3>
<div class="packages">
<div class="package" onclick="selectEvo(this,'3 Days - 72 TK')">3 Days<br>72 TK</div>
<div class="package" onclick="selectEvo(this,'7 Days - 87 TK')">7 Days<br>87 TK</div>
<div class="package" onclick="selectEvo(this,'30 Days - 332 TK')">30 Days<br>332 TK</div>
</div>
<p id="eshow">None</p>
</div>

<!-- Level Packs -->
<div class="section">
<h3>🎟 Level Packs</h3>
<div class="packages">
<div class="package" onclick="selectLevel(this,'6 Level - 40 TK')">6 Level<br>40 TK</div>
<div class="package" onclick="selectLevel(this,'10 Level - 72 TK')">10 Level<br>72 TK</div>
<div class="package" onclick="selectLevel(this,'25 Level - 92 TK')">25 Level<br>92 TK</div>
</div>
<p id="lshow">None</p>
</div>

<!-- Payment -->
<div class="section">
<h3>💳 Payment</h3>
<p>Number: <b id="number">01575693872</b> <button class="copy" onclick="copyNumber()">Copy</button></p>
<input type="text" id="txnID" placeholder="Transaction ID দিন">
</div>

<!-- Order -->
<div class="section">
<button onclick="sendOrder()">Order Now</button>
<div class="timer" id="timer"></div>
</div>

<script>
let selectedDiamond="", selectedEvo="", selectedLevel="";

function selectDiamond(el,name,price){
document.querySelectorAll(".section:nth-of-type(3) .package").forEach(p=>p.classList.remove("selected"));
el.classList.add("selected");
selectedDiamond=name+" ("+price+" TK)";
document.getElementById("dshow").innerText="Selected: "+selectedDiamond;
}

function selectEvo(el,val){
document.querySelectorAll(".section:nth-of-type(4) .package").forEach(p=>p.classList.remove("selected"));
el.classList.add("selected");
selectedEvo=val;
document.getElementById("eshow").innerText=val;
}

function selectLevel(el,val){
document.querySelectorAll(".section:nth-of-type(5) .package").forEach(p=>p.classList.remove("selected"));
el.classList.add("selected");
selectedLevel=val;
document.getElementById("lshow").innerText=val;
}

function copyNumber(){
navigator.clipboard.writeText(document.getElementById("number").innerText);
alert("Number Copied");
}

function sendOrder(){
let player=document.getElementById("playerID").value;
let txn=document.getElementById("txnID").value;
if(player=="" || txn=="" || selectedDiamond==""){
alert("সব তথ্য দিন");
return;
}

let message=`🔥 NEW ORDER 🔥
Player ID: ${player}
Diamond: ${selectedDiamond}
Evo: ${selectedEvo}
Level: ${selectedLevel}
Transaction ID: ${txn}`;

window.open("https://wa.me/8801575693872?text="+encodeURIComponent(message));

// 3 মিনিট Countdown
let time=180;
let t=document.getElementById("timer");
let interval=setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;
t.innerHTML="⏳ Processing: "+m+":"+(s<10?"0"+s:s);
time--;
if(time<0){
clearInterval(interval);
t.innerHTML="✅ Diamond Sent Successfully!";
}
},1000);
}
</script>

</body>
</html>
