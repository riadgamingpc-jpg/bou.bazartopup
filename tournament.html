<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOU Bazar - Tournament Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d13; color: #fff; padding-bottom: 50px; }
        header { background: linear-gradient(90deg, #ff4e50, #f9d423); padding: 20px; text-align: center; }
        header h1 { font-size: 24px; color: #000; text-transform: uppercase; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .section-title { font-size: 20px; color: #f9d423; margin: 25px 0 15px 0; border-left: 4px solid #ff4e50; padding-left: 10px; text-transform: uppercase; }
        .match-card { background-color: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .match-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a3a; padding-bottom: 10px; margin-bottom: 15px; }
        .match-title { font-size: 17px; font-weight: bold; color: #ff4e50; }
        .match-status { font-size: 12px; background-color: #23f923; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .match-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-bottom: 15px; }
        .detail-box { background-color: #252538; padding: 10px; border-radius: 8px; }
        .detail-label { font-size: 11px; color: #aaa; display: block; margin-bottom: 3px; }
        .detail-value { font-size: 14px; font-weight: bold; color: #f9d423; }
        .btn-join { width: 100%; background: linear-gradient(90deg, #ff4e50, #f9d423); color: #000; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .payment-box { background-color: #1e152a; border: 1px dashed #ff4e50; border-radius: 8px; padding: 10px; margin-top: 10px; text-align: center; }
        .number-highlight { color: #f9d423; font-size: 16px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <header><h1>BOU Bazar Tournament</h1></header>

    <div class="container">
        
        <!-- ================= FREE MATCH SECTION ================= -->
        <h2 class="section-title" style="color: #23f923; border-left-color: #23f923;">🎁 Free Match (ফ্রি টুর্নামেন্ট)</h2>
        <script>
            for(let i = 1; i <= 3; i++) {
                document.write(`
                <div class="match-card" style="border: 1px solid #23f923;">
                    <div class="match-header">
                        <span class="match-title" style="color: #23f923;">Special Free Match #0${i}</span>
                        <span class="match-status" style="background-color: #23f923;">ওপেন</span>
                    </div>
                    <div class="match-details">
                        <div class="detail-box"><span class="detail-label">প্রাইজ</span><span class="detail-value" style="color: #23f923;">৳ ৫০</span></div>
                        <div class="detail-box"><span class="detail-label">এন্ট্রি</span><span class="detail-value" style="color: #23f923;">FREE</span></div>
                        <div class="detail-box"><span class="detail-label">মোড</span><span class="detail-value">Solo</span></div>
                    </div>
                    <button class="btn-join" style="background: linear-gradient(90deg, #23f923, #f9d423);" onclick="joinFreeMatch('Free Match #0${i}')">ফ্রি জয়েন করুন</button>
                    <div class="payment-box" style="border-color: #23f923;"><p style="color: #23f923;">এই ম্যাচে কোনো টাকা লাগবে না, সম্পূর্ণ ফ্রি!</p></div>
                </div>`);
            }
        </script>

        <!-- ================= BATTLE ROYALE ================= -->
        <h2 class="section-title">Battle Royale Match</h2>
        <div class="match-card">
            <div class="match-header"><span class="match-title">Free Fire BR Match #18</span><span class="match-status">বুকিং ওপেন</span></div>
            <div class="match-details">
                <div class="detail-box"><span class="detail-label">প্রাইজ</span><span class="detail-value">৳ ৪০০</span></div>
                <div class="detail-box"><span class="detail-label">এন্ট্রি</span><span class="detail-value">৳ ১০</span></div>
                <div class="detail-box"><span class="detail-label">মোড</span><span class="detail-value">BR Solo</span></div>
            </div>
            <button class="btn-join" onclick="joinMatch('BR Match #18', 10)">জয়েন করুন</button>
            <div class="payment-box"><p>বিকাশ/নগদ নম্বর:</p><div class="number-highlight">01851634841</div></div>
        </div>

        <!-- ================= CLASH SQUAD (১০টি ম্যাচ) ================= -->
        <h2 class="section-title">Clash Squad (১০টি ম্যাচ)</h2>
        <script>
            const csFees = [60, 50, 70, 80];
            for(let i = 1; i <= 10; i++) {
                let fee = csFees[(i-1) % 4];
                document.write(`
                <div class="match-card">
                    <div class="match-header"><span class="match-title">4vs4 CS Match #0${i}</span><span class="match-status">ওপেন</span></div>
                    <div class="match-details">
                        <div class="detail-box"><span class="detail-label">প্রাইজ</span><span class="detail-value">৳ ৪০০</span></div>
                        <div class="detail-box"><span class="detail-label">এন্ট্রি</span><span class="detail-value">৳ ${fee}</span></div>
                        <div class="detail-box"><span class="detail-label">মোড</span><span class="detail-value">4v4 Squad</span></div>
                    </div>
                    <button class="btn-join" onclick="joinMatch('CS Match #0${i}', ${fee})">জয়েন করুন</button>
                    <div class="payment-box"><p>বিকাশ/নগদ নম্বর (৳${fee}):</p><div class="number-highlight">01851634841</div></div>
                </div>`);
            }
        </script>

        <!-- ================= LONE WOLF (৭টি ম্যাচ) ================= -->
        <h2 class="section-title">Lone Wolf Arena (৭টি ম্যাচ)</h2>
        <script>
            const lwFees = [60, 50, 70, 80];
            for(let i = 1; i <= 7; i++) {
                let fee = lwFees[(i-1) % 4];
                document.write(`
                <div class="match-card">
                    <div class="match-header"><span class="match-title">Lone Wolf Match #0${i}</span><span class="match-status">ওপেন</span></div>
                    <div class="match-details">
                        <div class="detail-box"><span class="detail-label">প্রাইজ</span><span class="detail-value">৳ ৪০০</span></div>
                        <div class="detail-box"><span class="detail-label">এন্ট্রি</span><span class="detail-value">৳ ${fee}</span></div>
                        <div class="detail-box"><span class="detail-label">মোড</span><span class="detail-value">1v1 Solo</span></div>
                    </div>
                    <button class="btn-join" onclick="joinMatch('Lone Wolf Match #0${i}', ${fee})">জয়েন করুন</button>
                    <div class="payment-box"><p>বিকাশ/নগদ নম্বর (৳${fee}):</p><div class="number-highlight">01851634841</div></div>
                </div>`);
            }
        </script>
    </div>

    <script>
        // পেড ম্যাচের জয়েনিং ফাংশন
        function joinMatch(m, f) {
            let info = prompt(m + "-এ জয়েন করতে আপনার ইন-গেম নাম এবং ৳" + f + " টাকা পাঠানোর লাস্ট ৩ ডিজিট দিন:");
            if (info) alert("আবেদন সফল হয়েছে! অ্যাডমিন আপনার পেমেন্ট চেক করে কনফার্ম করবেন।");
        }

        // ফ্রি ম্যাচের জয়েনিং ফাংশন
        function joinFreeMatch(m) {
            let info = prompt(m + " (ফ্রি)-এ জয়েন করতে শুধুমাত্র আপনার ইন-গেম নাম (Game Name) লিখুন:");
            if (info) alert("ফ্রি ম্যাচে আপনার রেজিস্ট্রেশন সফল হয়েছে! কোনো পেমেন্ট লাগবে না।");
        }
    </script>
</body>
</html>
